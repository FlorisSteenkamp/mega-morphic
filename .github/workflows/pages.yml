# Builds the demo and publishes it to GitHub Pages on every push to master.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # production mode, no inline source map (the dev config inlines one)
      - run: npx webpack --mode production --no-devtool
      # only what the page loads: the html, styles, bundle and test vectors
      - name: Stage site
        run: |
          mkdir -p _site/fonts-test
          cp index.html _site/
          cp -r css dist _site/
          cp fonts-test/vectors.svg _site/fonts-test/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
